name: Publish GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: stream

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: stream/.nvmrc
          cache: npm
          cache-dependency-path: stream/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build public snapshot
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BLOG_TIMEZONE: Australia/Sydney
      - uses: actions/upload-pages-artifact@v4
        with:
          path: stream/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
